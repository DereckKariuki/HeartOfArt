# Netlify build settings.
#
# Enquiries do NOT go through Netlify Forms — they go to Web3Forms, which
# needs VITE_WEB3FORMS_KEY set under Site configuration -> Environment
# variables. See src/lib/enquiry.js.

[build]
  command = "npm run build"
  publish = "dist"

# Vite 8 needs Node 20.19+ or 22.12+. Netlify's default has moved before and
# will again; pinning it here means the build does not start failing on a day
# nothing in this repo changed.
[build.environment]
  NODE_VERSION = "22"

# netlify/functions/submission-created.js was written for Netlify Forms and
# fires on a Netlify form submission. Nothing posts to Netlify Forms any
# more, so it never runs. Kept because the SMS logic inside it is still
# good; delete it, or rewire it to a Web3Forms webhook, when you decide.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Client-side routing: every path that is not a real file serves the app,
# which then reads the URL itself. Mirrors public/_redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
